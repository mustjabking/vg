<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYRAMOON — AI Builder & Video Generator</title>
<style>
:root{
  --bg:#09090d;
  --card:#15151d;
  --line:#292934;
  --txt:#f5f4fa;
  --mut:#9999a8;
  --purple:#8b35ff;
  --pink:#ff1682;
  --green:#20e0a0;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(139,53,255,.17), transparent 35%),
    radial-gradient(circle at 85% 35%, rgba(255,22,130,.07), transparent 25%),
    var(--bg);
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; }
button, input{ font-family:inherit; }

/* ============ TOP BAR ============ */
.topbar{
  position:sticky; top:0; z-index:50;
  height:52px;
  display:flex; align-items:center; justify-content:center;
  padding:0 16px;
  background:rgba(10,10,15,.88);
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(15px);
}
.topbar-inner{
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--mut);
}
.topbar-inner b{ color:#d7a9ff; letter-spacing:.5px; }
.dot{ color:#555563; }
.top-icon{ color:#c978ff; font-size:15px; }

/* ============ HOME ============ */
.home-wrap{ max-width:600px; margin:0 auto; padding:0 16px 70px; }

.home-head{ text-align:center; padding:38px 0 22px; }
.brand{ display:flex; align-items:center; justify-content:center; gap:12px; }
.logo{
  width:50px; height:50px;
  display:grid; place-items:center;
  border-radius:16px;
  background:linear-gradient(145deg,#9f4dff,#e20b91);
  box-shadow:0 10px 28px rgba(160,50,255,.34);
}
.logo svg{ width:28px; height:28px; }
h1{
  margin:0;
  font-size:clamp(30px,6vw,44px);
  line-height:1; letter-spacing:2px; font-weight:850;
  background:linear-gradient(100deg,#fff 20%,#e6c5ff 52%,#ff6ab9 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tagline{
  margin-top:11px; color:#aaa9b7;
  font-size:12px; letter-spacing:2.5px; text-transform:uppercase;
}
.creator{ margin-top:8px; font-size:12px; color:#767684; }
.creator b{ color:#dedde5; letter-spacing:.7px; }

/* ============ BUILDER CARD ============ */
.builder-card{
  background:linear-gradient(180deg,#15151d,#111118);
  border:1px solid #2a2a36;
  border-radius:22px;
  padding:26px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:cardIn .4s ease both;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(14px) scale(.98); }
  to{ opacity:1; transform:none; }
}

.field{ margin-bottom:16px; }
.field label{
  display:block;
  font-size:11px; letter-spacing:1.2px; text-transform:uppercase;
  color:#9a8fb0; margin-bottom:7px; font-weight:700;
}
.field .input-wrap{ position:relative; }
.field input{
  width:100%; height:52px; padding:0 16px;
  border-radius:13px; border:1px solid #30303b;
  background:#0f0f16; color:var(--txt);
  font-size:15px; outline:none; transition:.2s;
}
.field input:focus{
  border-color:#9346ef;
  box-shadow:0 0 0 4px rgba(139,53,255,.13);
}
.field input::placeholder{ color:#5a5a6a; }
.field .prefix-wrap input{ padding-left:78px; }
.field .prefix-wrap::before{
  content:"https://";
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:#7a7a8c; font-size:13px; pointer-events:none;
}
.field .hint{ font-size:11px; color:#6a6a7c; margin-top:6px; }

.preview-box{
  margin:20px 0 16px;
  padding:13px 15px;
  border-radius:13px;
  border:1px dashed #3a2a4a;
  background:rgba(139,53,255,.06);
  font-size:12px;
  color:#c9b0e6;
  word-break:break-all;
  line-height:1.55;
}
.preview-box .label{
  display:block;
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  color:#8a6aa8; margin-bottom:6px; font-weight:700;
}
.preview-box .url{
  color:#e6d4ff;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;
}

.btn-primary{
  width:100%; height:54px;
  border:0; border-radius:14px; cursor:pointer;
  color:#fff; font-weight:750; font-size:15px;
  background:linear-gradient(135deg,#7f25e9,#ed087d);
  box-shadow:0 12px 28px rgba(161,28,210,.22);
  transition:.2s;
}
.btn-primary:hover{ filter:brightness(1.12); transform:translateY(-1px); }
.btn-primary:active{ transform:translateY(0); }
.btn-primary:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.btn-ghost{
  width:100%; height:48px; margin-top:9px;
  border:1px solid #343440; border-radius:13px;
  background:#1a1a23; color:#cfc6dd;
  cursor:pointer; font-size:13px; font-weight:700;
  transition:.16s;
}
.btn-ghost:hover{ border-color:#8b35ff; color:#fff; }

.divider{
  display:flex; align-items:center; gap:12px;
  margin:24px 0 16px;
  color:#5a5a6a; font-size:10.5px;
  letter-spacing:2px; font-weight:700;
}
.divider::before,.divider::after{
  content:""; flex:1; height:1px; background:#26262f;
}

.direct-row{ display:flex; gap:8px; }
.direct-row input{
  flex:1; min-width:0; height:48px; padding:0 14px;
  border-radius:12px; border:1px solid #30303b;
  background:#0f0f16; color:var(--txt);
  font-size:13px; outline:none; transition:.2s;
}
.direct-row input:focus{ border-color:#9346ef; }
.direct-row button{
  padding:0 18px; border-radius:12px; border:0;
  background:linear-gradient(135deg,#8b35ff,#ff1682);
  color:#fff; font-weight:750; font-size:13px; cursor:pointer;
  transition:.16s;
}
.direct-row button:hover{ filter:brightness(1.1); }

/* ============ AI PAGE ============ */
.ai-page{
  min-height:100vh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(circle at 50% 0%, rgba(139,53,255,.16), transparent 42%),
    var(--bg);
}

.ai-topbar{
  position:sticky; top:0; z-index:50;
  padding:10px 14px;
  background:rgba(10,10,15,.88);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex; align-items:center; gap:11px;
}
.ai-back{
  width:36px; height:36px; flex-shrink:0;
  border:1px solid #2a2a36; border-radius:11px;
  background:#14141c; color:#9a8fb0;
  display:grid; place-items:center;
  cursor:pointer; font-size:16px;
  transition:.16s;
}
.ai-back:hover{ border-color:#8b35ff; color:#fff; }

.ai-avatar{
  width:44px; height:44px; flex-shrink:0;
  border-radius:14px;
  display:grid; place-items:center;
  font-size:19px; font-weight:900;
  color:#fff;
  background:linear-gradient(145deg,#9f4dff,#e20b91);
  box-shadow:0 8px 22px rgba(160,50,255,.4);
}
.ai-meta{ flex:1; min-width:0; }
.ai-name{
  font-size:16px; font-weight:800; color:#fff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.2;
}
.ai-by{
  font-size:11.5px; color:#9a8fb0; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ai-by b{ color:#d9b6ff; }

.ai-weblink{
  flex-shrink:0; max-width:130px;
  padding:8px 12px; border-radius:10px;
  background:rgba(139,53,255,.15);
  border:1px solid rgba(139,53,255,.35);
  color:#d9b6ff; font-size:11px; font-weight:700;
  text-decoration:none;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:.16s;
}
.ai-weblink:hover{ background:rgba(139,53,255,.28); }

/* ============ AI MAIN ============ */
.ai-main{
  flex:1;
  max-width:640px; width:100%;
  margin:0 auto;
  padding:26px 16px 60px;
}

.ai-hero{
  text-align:center;
  padding:14px 0 24px;
  animation:heroIn .5s ease both;
}
@keyframes heroIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:none; }
}

.ai-hero-orb{
  width:74px; height:74px; margin:0 auto 16px;
  border-radius:22px;
  display:grid; place-items:center;
  font-size:32px; font-weight:950; color:#fff;
  letter-spacing:-1.5px;
  background:linear-gradient(145deg,#9f4dff,#e20b91);
  box-shadow:
    0 16px 45px rgba(160,50,255,.42),
    inset 0 1px 1px rgba(255,255,255,.25);
  position:relative;
}
.ai-hero-orb::after{
  content:"";
  position:absolute; inset:-8px;
  border-radius:26px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 30px rgba(255,22,130,.2);
  pointer-events:none;
}

.ai-hero-name{
  font-size:26px; font-weight:850;
  background:linear-gradient(100deg,#fff 20%,#e6c5ff 52%,#ff6ab9 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  letter-spacing:1px;
  line-height:1.15;
}
.ai-hero-sub{
  margin-top:6px;
  font-size:12px; color:#9a8fb0;
  letter-spacing:.4px;
}
.ai-hero-sub b{ color:#d9b6ff; }

/* ============ PROMPT FORM ============ */
.prompt-form{
  display:flex; gap:10px;
  margin-bottom:6px;
}
.prompt-form input{
  flex:1; min-width:0;
  height:56px; padding:0 18px;
  border-radius:15px; border:1px solid #30303b;
  background:rgba(23,23,31,.94);
  color:var(--txt); font-size:14.5px;
  outline:none; transition:.2s;
}
.prompt-form input::placeholder{ color:#777785; }
.prompt-form input:focus{
  border-color:#9346ef;
  box-shadow:0 0 0 4px rgba(139,53,255,.13),0 12px 35px rgba(103,28,190,.18);
}
.prompt-form input:disabled{ opacity:.6; }

.prompt-form button{
  height:56px; padding:0 22px;
  border:0; border-radius:15px; cursor:pointer;
  color:#fff; font-weight:750; font-size:14px;
  background:linear-gradient(135deg,#7f25e9,#ed087d);
  box-shadow:0 12px 28px rgba(161,28,210,.22);
  transition:.2s; white-space:nowrap;
}
.prompt-form button:hover{ filter:brightness(1.12); transform:translateY(-1px); }
.prompt-form button:disabled{ opacity:.55; cursor:not-allowed; transform:none; }

.chips{
  display:flex; flex-wrap:wrap; gap:7px;
  margin:14px 0 26px;
  justify-content:center;
}
.chip{
  padding:7px 13px; border-radius:99px;
  border:1px solid #292934; background:#15151d;
  color:#9e9daa; font-size:11.5px; cursor:pointer;
  transition:.16s;
}
.chip:hover{ color:#fff; border-color:#8c3ee6; background:#1c1825; }

/* ============ STAGE ============ */
#stage{ margin-top:8px; }

/* ============ LOADING PANEL ============ */
.gen-panel{
  max-width:400px; margin:0 auto; padding:34px 24px 30px;
  border-radius:22px; border:1px solid #2a2a36;
  background:linear-gradient(180deg,#15151d,#111118);
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:panelIn .35s ease both;
}
@keyframes panelIn{
  from{ opacity:0; transform:translateY(12px) scale(.98); }
  to{ opacity:1; transform:none; }
}

.gen-orb{
  width:70px; height:70px; margin:0 auto 18px;
  border-radius:50%;
  background:conic-gradient(from 0deg,#9f4dff,#e20b91,#ff6ab9,#9f4dff);
  animation:spin 1.6s linear infinite;
  position:relative;
  box-shadow:0 0 45px rgba(160,50,255,.45);
}
.gen-orb::after{
  content:"";
  position:absolute; inset:7px; border-radius:50%;
  background:#101017;
}
.gen-orb::before{
  content:"✦";
  position:absolute; inset:0;
  display:grid; place-items:center;
  font-size:23px; color:#e0b4ff;
  z-index:2;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pulse{
  0%,100%{ opacity:.55; transform:scale(.9); }
  50%{ opacity:1; transform:scale(1.08); }
}

.gen-title{
  font-size:15.5px; font-weight:800; letter-spacing:.3px;
  color:#f2eaff;
}
.gen-sub{
  margin-top:7px; font-size:12px; color:#9a8fb0;
  font-style:italic;
  display:-webkit-box; -webkit-box-orient:vertical;
  -webkit-line-clamp:2; overflow:hidden;
  line-height:1.5;
}

.gen-bar{
  height:6px; margin:22px auto 14px;
  border-radius:99px; background:#22222c; overflow:hidden;
  max-width:300px;
}
.gen-bar span{
  display:block; height:100%; width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#8b35ff,#ff1682);
  box-shadow:0 0 16px rgba(255,22,130,.6);
  animation:fillbar 15s linear forwards;
}
@keyframes fillbar{ to{ width:100%; } }

.gen-step{
  font-size:12px; color:#8f8fa3; letter-spacing:.3px;
  min-height:18px;
  transition:opacity .3s;
}
.gen-step b{ color:#d9b6ff; }

/* ============ CARD ============ */
.stage-wrap{
  width:min(340px,86vw);
  margin:0 auto;
  animation:cardIn2 .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes cardIn2{
  from{ opacity:0; transform:translateY(20px) scale(.96); }
  to{ opacity:1; transform:none; }
}

.card{
  overflow:hidden; border-radius:18px;
  border:1px solid #292934;
  background:linear-gradient(180deg,#16161e,#121219);
  box-shadow:0 22px 55px rgba(0,0,0,.45);
}

.frame{
  position:relative; width:100%;
  aspect-ratio:9/16;
  background:#000; overflow:hidden;
}
.frame .yt-holder{
  position:absolute; inset:0;
  width:100%; height:100%;
}
.frame .yt-thumb{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover; display:block; pointer-events:none;
}
.frame iframe{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  border:0 !important;
  pointer-events:none !important;
}
.frame .video-shield{
  position:absolute; inset:0;
  z-index:15; cursor:pointer; background:transparent;
}
.frame .brand-mask-top{
  position:absolute; left:0; right:0; top:0;
  height:12%;
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  z-index:11; pointer-events:none; opacity:.35;
}
.frame .brand-mask-br{
  position:absolute; right:0; bottom:0;
  width:26%; height:9%;
  background:linear-gradient(135deg,transparent,rgba(0,0,0,.85));
  z-index:11; pointer-events:none;
}

.ai-badge{
  position:absolute; top:10px; left:10px; z-index:14;
  padding:5px 10px; border-radius:99px;
  background:rgba(10,8,16,.62);
  border:1px solid rgba(190,83,255,.4);
  color:#dcb8ff; font-size:9.5px; font-weight:750;
  letter-spacing:1.2px;
  backdrop-filter:blur(6px);
  pointer-events:none;
}

.lyra-center-play{
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  width:76px; height:76px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  background:linear-gradient(145deg,#9f4dff 0%,#7c22df 45%,#e20b91 100%);
  border:2px solid rgba(255,255,255,.28);
  color:#fff;
  font-size:40px; font-weight:950; line-height:1;
  letter-spacing:-3px; text-indent:-3px;
  cursor:pointer;
  box-shadow:
    0 12px 35px rgba(0,0,0,.55),
    0 0 35px rgba(139,53,255,.48),
    inset 0 1px 1px rgba(255,255,255,.25);
  transition:transform .22s ease,filter .22s ease,box-shadow .22s ease;
  user-select:none;
}
.lyra-center-play::before{
  content:""; position:absolute; inset:-7px; border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 25px rgba(255,22,130,.18);
  pointer-events:none;
}
.lyra-center-play:hover{
  transform:translate(-50%,-50%) scale(1.09);
  filter:brightness(1.12);
  box-shadow:
    0 15px 40px rgba(0,0,0,.6),
    0 0 48px rgba(255,22,130,.52),
    inset 0 1px 1px rgba(255,255,255,.3);
}
.lyra-center-play:active{ transform:translate(-50%,-50%) scale(.95); }
.lyra-center-play.hidden{
  opacity:0; pointer-events:none;
  transform:translate(-50%,-50%) scale(.72);
}

.meta{ padding:13px 13px 14px; }

.title{
  display:-webkit-box; -webkit-box-orient:vertical;
  -webkit-line-clamp:2; overflow:hidden;
  min-height:34px; margin-bottom:8px;
  color:#f0eff5; text-decoration:none;
  font-size:13px; font-weight:700; line-height:1.35;
}
.title:hover{ color:#df9fff; }

.sub{
  display:flex; justify-content:space-between; gap:8px;
  color:#777785; font-size:11px;
}
.sub span:first-child{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.dl-row{
  display:grid; grid-template-columns:1fr 1fr;
  gap:7px; margin-top:12px;
}
.dl-btn,.share-btn{
  min-width:0; min-height:42px;
  display:inline-flex; align-items:center; justify-content:center;
  gap:6px; padding:9px 7px; border-radius:11px;
  border:1px solid transparent; color:#fff;
  font-size:11.5px; font-weight:750;
  text-decoration:none; cursor:pointer; transition:.16s;
  font-family:inherit;
}
.dl-btn:hover,.share-btn:hover{
  transform:translateY(-1px); filter:brightness(1.12);
}
.dl-btn.ss{ background:linear-gradient(135deg,#ff2d55,#ff0060); }
.dl-btn.vm{ background:linear-gradient(135deg,#8a2be2,#4b0f8a); }

.share-btn{
  grid-column:1 / -1;
  background:#20202a; border-color:#343440; color:#dedde6;
}
.share-btn:hover{ border-color:#9346ef; color:#fff; background:#28212f; }
.share-btn.copied{
  background:linear-gradient(135deg,#168d71,#20c997);
  border-color:transparent;
}

/* ============ EMPTY / FALLBACK ============ */
.empty{
  max-width:400px; margin:0 auto;
  padding:28px 22px; text-align:center;
  border:1px dashed #30303b; border-radius:18px;
  color:#858592; line-height:1.75; font-size:13px;
  background:#13131a;
}
.empty b{ color:#eee; }
.empty .yt-direct{
  display:inline-block; margin-top:14px;
  padding:11px 20px; border-radius:12px;
  background:linear-gradient(135deg,#7f25e9,#ed087d);
  color:#fff; text-decoration:none;
  font-size:12.5px; font-weight:750;
}

/* ============ FOOTER ============ */
.ai-foot{
  text-align:center; padding:12px 20px 30px;
  color:#5f5f6d; font-size:11px; line-height:1.8;
}
.ai-foot .fb{
  color:#e9e8ee; font-size:12px; font-weight:850; letter-spacing:3px;
}
.ai-foot .fb span{ color:#ef1682; }
.ai-foot .fc{ margin:3px 0 8px; color:#777785; }
.ai-foot .fc b{ color:#d5d4dc; }

/* ============ TOAST ============ */
.toast{
  position:fixed;
  left:50%; bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#168d71,#20c997);
  color:#fff; padding:11px 22px; border-radius:12px;
  font-size:13px; font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  opacity:0; pointer-events:none;
  transition:.3s; z-index:200;
  max-width:90vw; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ============ RESPONSIVE ============ */
@media(max-width:560px){
  .builder-card{ padding:22px 17px; border-radius:18px; }
  .ai-weblink{ display:none; }
  .home-head{ padding-top:30px; }
  .logo{ width:44px; height:44px; border-radius:14px; }
  .logo svg{ width:25px; height:25px; }
  h1{ font-size:28px; }
  .tagline{ font-size:10.5px; letter-spacing:1.8px; }
  .prompt-form{ flex-direction:column; }
  .prompt-form input, .prompt-form button{ width:100%; height:52px; }
  .ai-hero-name{ font-size:23px; }
  .lyra-center-play{ width:64px; height:64px; font-size:34px; }
  .gen-panel{ padding:28px 18px 26px; }
}
@media(prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; scroll-behavior:auto !important; }
  .gen-bar span{ animation-duration:15s !important; }
  .lyra-center-play{ transition:none; }
}
</style>
</head>

<div id="app"></div>
